[project]
name = "book-review-worker"
version = "0.1.0"
description = "Render worker: TTS, images, motion, compose"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "edge-tts>=7.3.1",
    "pillow>=11.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_review_worker"]
