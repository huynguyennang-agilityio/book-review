[project]
name = "book-review-api"
version = "0.1.0"
description = "FastAPI + LangGraph backend"
requires-python = ">=3.12"
# Version thư viện LangChain/LangGraph/AG-UI sẽ được pin sau spike ngày 2.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_review_api"]
