[project]
name = "book-review-api"
version = "0.1.0"
description = "FastAPI + LangGraph backend"
requires-python = ">=3.12"
# LangGraph / psycopg pin theo spike ngày 2 (docs/spikes/day-02-stack.md).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.10",
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "langchain-postgres>=0.0.19",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "sqlalchemy>=2",
    "pgvector>=0.3.6",
    "langchain-classic>=1.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_review_api"]
