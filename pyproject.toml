[project]
name = "book-review"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.uv.sources]
book-review-api = { workspace = true }
book-review-worker = { workspace = true }

[dependency-groups]
dev = [
    "book-review-api",
    "book-review-worker",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["book_review_api", "book_review_worker"]
