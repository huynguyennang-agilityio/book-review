[project]
name = "book-review"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.uv.sources]
book-review-api = { workspace = true }
book-review-worker = { workspace = true }

[dependency-groups]
dev = [
    "book-review-api",
    "book-review-worker",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "httpx2>=2.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code thử nghiệm ngày 1–2, không giữ chuẩn lint.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "apps/worker/src", "tests"]
mypy_path = ["apps/api/src", "apps/worker/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.isort]
known-first-party = ["book_review_api", "book_review_worker"]
