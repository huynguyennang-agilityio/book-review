name: Deploy

# Merge vào main: build image, deploy staging, smoke test.
# Tag vX.Y.Z: deploy production. Thiếu secret của môi trường thì bước deploy được bỏ qua (không fail).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    # Smoke test: 1 video ngắn, provider giả lập (ảnh placeholder), worker chạy từ image vừa build.
    needs: images
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-dejavu-core
      - run: uv sync --locked
      - run: |
          uv run arq book_review_worker.main.WorkerSettings > worker.log 2>&1 &
          sleep 5
          uv run python scripts/smoke_test.py
      - if: failure()
        run: cat worker.log

  staging:
    if: github.ref == 'refs/heads/main'
    needs: [images, smoke]
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.SSH_HOST != ''
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          path: ${{ vars.DEPLOY_PATH || '~/book-review' }}
          image-tag: ${{ github.sha }}
      - name: Smoke test staging
        if: env.SSH_HOST != '' && vars.API_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 "${{ vars.API_URL }}/health"
      - name: Bỏ qua
        if: env.SSH_HOST == ''
        run: echo "::notice::Chưa cấu hình secret SSH_HOST cho Environment 'staging', bỏ qua deploy."

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images, smoke]
    runs-on: ubuntu-latest
    environment: production # cấu hình required reviewers nếu muốn duyệt tay
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.SSH_HOST != ''
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          path: ${{ vars.DEPLOY_PATH || '~/book-review' }}
          image-tag: ${{ github.ref_name }}
      - name: Health check
        if: env.SSH_HOST != '' && vars.API_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.API_URL }}/health"
      - name: Bỏ qua
        if: env.SSH_HOST == ''
        run: echo "::notice::Chưa cấu hình secret SSH_HOST cho Environment 'production', bỏ qua deploy."
