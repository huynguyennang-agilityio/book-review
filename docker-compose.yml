services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_review
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Toàn bộ app trong Docker: `docker compose up -d --build`, mở http://localhost:3000.
  # Đọc .env (khoá Gemini/Tavily, SUPABASE_URL, NEXT_PUBLIC_SUPABASE_*) nhưng ép DB/Redis/media về container.
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/book_review
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /app/var/media
    volumes:
      - ./var/media:/app/var/media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "uv run --no-sync python -m book_review_api.migrate &&
      uv run --no-sync uvicorn book_review_api.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-build-placeholder}
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /app/var/media
    volumes:
      # API chạy trên máy đọc cùng thư mục media.
      - ./var/media:/app/var/media
    depends_on:
      - redis

volumes:
  pgdata:
